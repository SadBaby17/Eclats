<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Actualiser Éclats</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f8f5ef;
        color: #302e29;
      }
      body {
        max-width: 420px;
        margin: 12vh auto;
        padding: 28px;
        line-height: 1.7;
      }
      h1 {
        font:
          normal 34px Georgia,
          serif;
      }
      .mark {
        color: #92713e;
        font-size: 28px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 3px;
        padding: 14px 20px;
        background: #302e29;
        color: #f8f5ef;
        cursor: pointer;
        width: 100%;
      }
      button:disabled {
        opacity: 0.6;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid #92713e;
        outline-offset: 4px;
      }
      #status {
        min-height: 4em;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1b1d1d;
          color: #e2dfd6;
        }
        button {
          background: #e2dfd6;
          color: #1b1d1d;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">✧</div>
    <h1>Retrouver Éclats</h1>
    <p>
      Chargez la dernière version de l’application. Votre progression et vos
      préférences restent conservées sur cet appareil.
    </p>
    <button id="update">Actualiser Éclats</button>
    <p id="status" role="status">Une connexion Internet est nécessaire.</p>
    <a href="./">Revenir à l’application</a>
    <script>
      const button = document.getElementById("update");
      const status = document.getElementById("status");
      function waitFor(worker, states) {
        if (states.includes(worker.state)) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => finish(Error("timeout")), 20000);
          function finish(error) {
            clearTimeout(timer);
            worker.removeEventListener("statechange", changed);
            error ? reject(error) : resolve();
          }
          function changed() {
            if (states.includes(worker.state)) finish();
            else if (worker.state === "redundant")
              finish(Error("installation"));
          }
          worker.addEventListener("statechange", changed);
          changed();
        });
      }
      button.onclick = async () => {
        button.disabled = true;
        status.textContent =
          "Vérification et téléchargement de la mise à jour…";
        try {
          if (!("serviceWorker" in navigator)) {
            location.replace("./");
            return;
          }
          const registration =
            await navigator.serviceWorker.getRegistration("./");
          if (!registration) {
            location.replace("./");
            return;
          }
          await registration.update();
          if (registration.installing)
            await waitFor(registration.installing, [
              "installed",
              "activating",
              "activated",
            ]);
          const worker = registration.waiting;
          if (worker) {
            status.textContent = "Ouverture de la nouvelle version…";
            worker.postMessage({ type: "ACTIVATE" });
            await waitFor(worker, ["activated"]);
          }
          location.replace("./");
        } catch {
          status.textContent =
            "La mise à jour n’a pas abouti. Vérifiez votre connexion et réessayez. Votre progression n’a pas été effacée.";
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
